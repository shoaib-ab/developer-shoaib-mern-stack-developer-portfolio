<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>
    <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Modern dark squircle border & surface -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#2E2E32" stroke-width="1.5" />

  <!-- Elegant 'S' monogram (Developer Shoaib) -->
  <path d="M37.5 21 C36 18.5 33.2 17.2 29.5 17.2 C24.2 17.2 20.5 20.5 20.5 25.4 C20.5 33 33.5 31.8 33.5 37.6 C33.5 40.8 30.6 42.5 26.8 42.5 C22.4 42.5 19.5 39.8 18.5 36.8" 
        fill="none" 
        stroke="url(#letterGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Signature Emerald Green Brand Dot -->
  <circle cx="43" cy="41" r="4.2" fill="#14A800" filter="url(#emeraldGlow)" />
</svg>
