<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <!-- Background -->
  <rect width="1200" height="750" fill="#0F172A" />

  <!-- App Header -->
  <rect width="1200" height="60" fill="#1E293B" stroke="#334155" />
  <circle cx="32" cy="30" r="6" fill="#EF4444" />
  <circle cx="52" cy="30" r="6" fill="#F59E0B" />
  <circle cx="72" cy="30" r="6" fill="#10B981" />

  <text x="110" y="36" fill="#C084FC" font-family="sans-serif" font-size="16" font-weight="700">Roster</text>
