      <text x="56" y="48" fill="#94A3B8" font-family="sans-serif" font-size="10">Part-Time Assistant • 20h</text>

      <!-- Shift Mon -->
      <rect x="190" y="10" width="175" height="50" rx="4" fill="#D97706" />
      <text x="205" y="32" fill="#FFF" font-family="sans-serif" font-size="12" font-weight="600">11:00 – 17:00</text>
      <text x="205" y="48" fill="#FEF3C7" font-family="sans-serif" font-size="10">Midday Rush</text>

