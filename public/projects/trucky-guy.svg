<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Navigation Bar -->
  <rect width="1200" height="70" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <circle cx="36" cy="35" r="7" fill="#EF4444" />
  <circle cx="58" cy="35" r="7" fill="#F59E0B" />
  <circle cx="80" cy="35" r="7" fill="#10B981" />

  <!-- Brand Logo -->
  <g transform="translate(120, 22)">
    <rect width="36" height="26" rx="4" fill="url(#redAccent)" />
    <!-- Truck Icon Simple -->
    <path d="M6 18 V10 H22 V18 H6 Z M22 13 H28 L31 16 V18 H22 Z" fill="#FFF" />
    <circle cx="11" cy="20" r="3" fill="#0F172A" />
    <circle cx="26" cy="20" r="3" fill="#0F172A" />
    <text x="46" y="19" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="1">TRUCKY GUY</text>
  </g>

  <!-- Nav Links & Badge -->
  <text x="620" y="41" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="500">Services</text>
  <text x="700" y="41" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="500">Fleet</text>
  <text x="760" y="41" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="500">Coverage</text>
  <text x="850" y="41" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="500">FAQ</text>
  
  <rect x="940" y="20" width="80" height="30" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="955" y="40" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">DE / EN</text>

  <rect x="1035" y="18" width="130" height="34" rx="6" fill="url(#redAccent)" />
  <text x="1052" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Request Quote</text>

  <!-- Hero Section -->
  <g transform="translate(60, 110)">
    <!-- Tag -->
    <rect width="210" height="26" rx="13" fill="#3B1219" stroke="#DC2626" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#EF4444" />
    <text x="26" y="17" fill="#FCA5A5" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">EUROPEAN FREIGHT DISPATCH</text>

    <!-- Heading -->
    <text x="0" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="800">Reliable European Transport &amp;</text>
    <text x="0" y="108" fill="#F87171" font-family="sans-serif" font-size="34" font-weight="800">Express Freight Logistics</text>
    
    <text x="0" y="145" fill="#94A3B8" font-family="sans-serif" font-size="15" width="550">Direct road transport across Germany and EU corridors. From urgent Sprinter express</text>
    <text x="0" y="168" fill="#94A3B8" font-family="sans-serif" font-size="15">to full truckload logistics with guaranteed delivery timelines and instant quotes.</text>
  </g>

  <!-- Transport Quote Form Card -->
  <g transform="translate(680, 100)">
    <rect width="460" height="340" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    
    <text x="30" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">Instant Transport Request</text>
    <text x="30" y="62" fill="#9CA3AF" font-family="sans-serif" font-size="12">Get a dedicated freight dispatch quote in under 15 minutes</text>

    <!-- Form Fields -->
    <!-- Origin -->
    <rect x="30" y="82" width="195" height="44" rx="8" fill="#111827" stroke="#4B5563" />
    <text x="44" y="100" fill="#9CA3AF" font-family="sans-serif" font-size="10">PICKUP LOCATION (PLZ / CITY)</text>
    <text x="44" y="118" fill="#F9FAFB" font-family="sans-serif" font-size="13" font-weight="600">Dorsten, NRW (46282)</text>

    <!-- Destination -->
    <rect x="235" y="82" width="195" height="44" rx="8" fill="#111827" stroke="#4B5563" />
    <text x="249" y="100" fill="#9CA3AF" font-family="sans-serif" font-size="10">DELIVERY DESTINATION</text>
    <text x="249" y="118" fill="#F9FAFB" font-family="sans-serif" font-size="13" font-weight="600">Rotterdam, Netherlands</text>

    <!-- Cargo Type -->
    <rect x="30" y="140" width="195" height="44" rx="8" fill="#111827" stroke="#4B5563" />
    <text x="44" y="158" fill="#9CA3AF" font-family="sans-serif" font-size="10">CARGO WEIGHT / PALLETS</text>
    <text x="44" y="176" fill="#F9FAFB" font-family="sans-serif" font-size="13" font-weight="600">3 Euro Pallets (1,200 kg)</text>

    <!-- Service Speed -->
    <rect x="235" y="140" width="195" height="44" rx="8" fill="#111827" stroke="#4B5563" />
    <text x="249" y="158" fill="#9CA3AF" font-family="sans-serif" font-size="10">SERVICE LEVEL</text>
    <text x="249" y="176" fill="#EF4444" font-family="sans-serif" font-size="13" font-weight="700">Same-Day Express</text>

    <!-- Contact details -->
    <rect x="30" y="198" width="400" height="44" rx="8" fill="#111827" stroke="#4B5563" />
    <text x="44" y="216" fill="#9CA3AF" font-family="sans-serif" font-size="10">COMPANY EMAIL / TELEPHONE</text>
    <text x="44" y="234" fill="#F9FAFB" font-family="sans-serif" font-size="13">dispatch@client-logistics.eu | +49 ...</text>

    <!-- Submit Button -->
    <rect x="30" y="260" width="400" height="50" rx="8" fill="url(#redAccent)" />
    <text x="145" y="291" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">SUBMIT FREIGHT REQUEST →</text>
  </g>

  <!-- Service Cards Row -->
  <g transform="translate(60, 480)">
    <!-- Card 1 -->
    <rect width="335" height="210" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="45" cy="45" r="22" fill="#3B1219" />
    <path d="M37 45 H53 M47 39 L53 45 L47 51" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="80" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Express Courier Service</text>
    <text x="80" y="62" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="600">Urgent &amp; Direct Deliveries</text>
    
    <text x="30" y="105" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Direct non-stop transport</text>
    <text x="30" y="130" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Dedicated Sprinter vans (up to 1.5t)</text>
    <text x="30" y="155" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Real-time GPS driver tracking</text>
    <text x="30" y="180" fill="#94A3B8" font-family="sans-serif" font-size="12">Coverage: DE, NL, BE, LU, FR, PL</text>

    <!-- Card 2 -->
    <g transform="translate(370, 0)">
      <rect width="335" height="210" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="45" cy="45" r="22" fill="#1E3A8A" />
      <path d="M37 42 H53 M37 48 H48" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" />
      <text x="80" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Part Loads (LTL)</text>
      <text x="80" y="62" fill="#60A5FA" font-family="sans-serif" font-size="12" font-weight="600">Cost-Effective Consolidation</text>
      
      <text x="30" y="105" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Pallet freight from 1 to 10 pallets</text>
      <text x="30" y="130" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Scheduled corridor routes weekly</text>
      <text x="30" y="155" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Tail-lift pickup and delivery options</text>
      <text x="30" y="180" fill="#94A3B8" font-family="sans-serif" font-size="12">Hub: Dorsten, North Rhine-Westphalia</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(740, 0)">
      <rect width="340" height="210" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="45" cy="45" r="22" fill="#064E3B" />
      <path d="M38 50 V40 H52 V50 M42 40 V36 H48 V40" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
      <text x="80" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Full Truckloads (FTL)</text>
      <text x="80" y="62" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="600">Heavy Haul &amp; Complete Loads</text>
      
      <text x="30" y="105" fill="#CBD5E1" font-family="sans-serif" font-size="13">• 24t curtain-sider &amp; mega-trailers</text>
      <text x="30" y="130" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Cross-border customs assistance</text>
      <text x="30" y="155" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Dedicated dispatcher 24/7 on-call</text>
      <text x="30" y="180" fill="#94A3B8" font-family="sans-serif" font-size="12">SLA: 99.4% On-Time Delivery</text>
    </g>
  </g>
</svg>
