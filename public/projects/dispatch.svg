<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <!-- Background -->
  <rect width="1200" height="750" fill="#181108" />

  <!-- App Header -->
  <rect width="1200" height="60" fill="#2E1B09" stroke="#451A03" />
  <circle cx="32" cy="30" r="6" fill="#EF4444" />
  <circle cx="52" cy="30" r="6" fill="#F59E0B" />
  <circle cx="72" cy="30" r="6" fill="#10B981" />

  <text x="110" y="36" fill="#FBBF24" font-family="sans-serif" font-size="16" font-weight="700">Dispatch Hub</text>
  <text x="230" y="36" fill="#D97706" font-family="sans-serif" font-size="13">Transactional Email &amp; SMS Microservice</text>

  <rect x="990" y="16" width="170" height="28" rx="14" fill="#451A03" stroke="#F59E0B" />
  <circle cx="1008" cy="30" r="4" fill="#10B981" />
  <text x="1020" y="35" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="600">SLA: 99.82% DELIVERED</text>

  <!-- Metric Strip -->
  <g transform="translate(50, 90)">
    <rect width="250" height="90" rx="8" fill="#2E1B09" stroke="#451A03" />
    <text x="20" y="30" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="600">MESSAGES THIS MONTH</text>
    <text x="20" y="65" fill="#FFF" font-family="sans-serif" font-size="26" font-weight="700">650,420</text>

    <g transform="translate(280, 0)">
      <rect width="250" height="90" rx="8" fill="#2E1B09" stroke="#451A03" />
      <text x="20" y="30" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="600">AVG DELIVERY LATENCY</text>
      <text x="20" y="65" fill="#FFF" font-family="sans-serif" font-size="26" font-weight="700">1.2s</text>
      <text x="110" y="65" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">SendGrid OK</text>
    </g>

    <g transform="translate(560, 0)">
      <rect width="250" height="90" rx="8" fill="#2E1B09" stroke="#451A03" />
      <text x="20" y="30" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="600">SMS GATEWAY ROUTE</text>
      <text x="20" y="65" fill="#FFF" font-family="sans-serif" font-size="26" font-weight="700">Twilio Hub</text>
    </g>

    <g transform="translate(840, 0)">
      <rect width="260" height="90" rx="8" fill="#2E1B09" stroke="#451A03" />
      <text x="20" y="30" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="600">AUTO-RETRY QUEUE</text>
      <text x="20" y="65" fill="#10B981" font-family="sans-serif" font-size="26" font-weight="700">0 Pending</text>
    </g>
  </g>

  <!-- Live Message Event Feed Table -->
  <g transform="translate(50, 215)">
    <rect width="1100" height="480" rx="8" fill="#251608" stroke="#451A03" />
    <rect width="1100" height="45" rx="8" fill="#38200C" />
    <text x="24" y="28" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="600">CHANNEL</text>
    <text x="180" y="28" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="600">RECIPIENT</text>
    <text x="440" y="28" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="600">TEMPLATE</text>
    <text x="700" y="28" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="600">STATUS</text>
    <text x="960" y="28" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="600">DELIVERED AT</text>

    <!-- Event 1 -->
    <g transform="translate(0, 45)">
      <rect width="1100" height="55" fill="#251608" />
      <rect x="24" y="15" width="70" height="24" rx="4" fill="#0369A1" />
      <text x="36" y="31" fill="#E0F2FE" font-family="sans-serif" font-size="11" font-weight="bold">EMAIL</text>
      <text x="180" y="34" fill="#FDF4EA" font-family="sans-serif" font-size="13">sarah.chen@client.com</text>
      <text x="440" y="34" fill="#FCD34D" font-family="sans-serif" font-size="13">order_confirmation_v3</text>
      <text x="700" y="34" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold">✓ 200 DELIVERED</text>
      <text x="960" y="34" fill="#92400E" font-family="sans-serif" font-size="12">1s ago</text>
    </g>

    <!-- Event 2 -->
    <g transform="translate(0, 100)">
      <rect width="1100" height="55" fill="#2E1B09" />
      <rect x="24" y="15" width="60" height="24" rx="4" fill="#B91C1C" />
      <text x="38" y="31" fill="#FEE2E2" font-family="sans-serif" font-size="11" font-weight="bold">SMS</text>
      <text x="180" y="34" fill="#FDF4EA" font-family="sans-serif" font-size="13">+1 (555) 234-8901</text>
      <text x="440" y="34" fill="#FCD34D" font-family="sans-serif" font-size="13">security_login_otp</text>
      <text x="700" y="34" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold">✓ 200 DELIVERED</text>
      <text x="960" y="34" fill="#92400E" font-family="sans-serif" font-size="12">4s ago</text>
    </g>

    <!-- Event 3 -->
    <g transform="translate(0, 155)">
      <rect width="1100" height="55" fill="#251608" />
      <rect x="24" y="15" width="70" height="24" rx="4" fill="#0369A1" />
      <text x="36" y="31" fill="#E0F2FE" font-family="sans-serif" font-size="11" font-weight="bold">EMAIL</text>
      <text x="180" y="34" fill="#FDF4EA" font-family="sans-serif" font-size="13">mark.taylor@enterprise.io</text>
      <text x="440" y="34" fill="#FCD34D" font-family="sans-serif" font-size="13">monthly_invoice_receipt</text>
      <text x="700" y="34" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold">✓ 200 DELIVERED</text>
      <text x="960" y="34" fill="#92400E" font-family="sans-serif" font-size="12">12s ago</text>
    </g>
  </g>
</svg>
